<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Licence architecture">
  <rect width="920" height="420" fill="#07090d"/>
  <text x="40" y="42" fill="#e2b15a" font-family="Georgia, serif" font-size="18">Licence · TrueForge in the loop</text>
  <rect x="40" y="70" width="180" height="90" rx="14" fill="#10141c" stroke="#e2b15a"/>
  <text x="58" y="108" fill="#f4efe4" font-size="14">Licence Desk UI</text>
  <text x="58" y="128" fill="#9aa3b2" font-size="11">doing / waiting / did</text>
  <rect x="270" y="70" width="200" height="90" rx="14" fill="#10141c" stroke="#7ee0c3"/>
  <text x="288" y="108" fill="#f4efe4" font-size="14">TrueForge harness</text>
  <text x="288" y="128" fill="#9aa3b2" font-size="11">loop · session · approval</text>
  <rect x="520" y="40" width="170" height="70" rx="14" fill="#10141c" stroke="#7aa2ff"/>
  <text x="538" y="72" fill="#f4efe4" font-size="13">MCP harbor-pay</text>
  <text x="538" y="90" fill="#9aa3b2" font-size="11">read tools + gated writes</text>
  <rect x="720" y="40" width="160" height="70" rx="14" fill="#10141c" stroke="#b7a6ff"/>
  <text x="738" y="72" fill="#f4efe4" font-size="13">Subagents</text>
  <text x="738" y="90" fill="#9aa3b2" font-size="11">metrics · deploys · logs</text>
  <rect x="520" y="140" width="170" height="70" rx="14" fill="#10141c" stroke="#7ee0c3"/>
  <text x="538" y="172" fill="#f4efe4" font-size="13">Isolate</text>
  <text x="538" y="190" fill="#9aa3b2" font-size="11">no net · no fs · 8s</text>
  <rect x="720" y="140" width="160" height="70" rx="14" fill="#10141c" stroke="#f0b45a"/>
  <text x="738" y="172" fill="#f4efe4" font-size="13">Licence gate</text>
  <text x="738" y="190" fill="#9aa3b2" font-size="11">rollback waits here</text>
  <path d="M220 115 H270" stroke="#e2b15a" fill="none"/>
  <path d="M470 115 H520" stroke="#7ee0c3" fill="none"/>
  <path d="M690 75 H720" stroke="#7aa2ff" fill="none"/>
  <path d="M605 110 V140" stroke="#7ee0c3" fill="none"/>
  <path d="M690 175 H720" stroke="#f0b45a" fill="none"/>
  <text x="40" y="250" fill="#f4efe4" font-size="13">1. Desk sends one line: investigate, roll back if a deploy caused it.</text>
  <text x="40" y="278" fill="#f4efe4" font-size="13">2. TrueForge reaches MCP, fans out subagents, runs the diagnostic isolate.</text>
  <text x="40" y="306" fill="#f4efe4" font-size="13">3. Cause is 4c21. rollback_deploy is gated. The desk shows HOLD.</text>
  <text x="40" y="334" fill="#f4efe4" font-size="13">4. Operator grants or denies. Only then does production move.</text>
  <text x="40" y="372" fill="#9aa3b2" font-size="12">Session stays on TrueForge. Refresh does not mint a new incident.</text>
</svg>
